<h2 class="mb-4">Mi carrito</h2>

@if (cargando) {
  <div class="text-center my-5">
    <div class="spinner-border" role="status"></div>
  </div>
} @else if (carrito.items.length === 0) {
  <div class="alert alert-info">
    Tu carrito está vacío. <a routerLink="/catalogo">Ver catálogo</a>
  </div>
} @else {
  <div>
    @for (item of carrito.items; track item.producto_id) {
      <div class="card mb-3">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="mb-1">{{ item.nombre }}</h5>
            <p class="mb-0 text-muted">{{ item.precio }}€ × {{ item.cantidad }} = {{ item.subtotal }}€</p>
          </div>
          <button class="btn btn-outline-danger btn-sm" (click)="eliminarProducto(item.producto_id)">
            Eliminar
          </button>
        </div>
      </div>
    }
    <div class="card bg-light mt-3">
      <div class="card-body d-flex justify-content-between align-items-center">
        <h4 class="mb-0">Total: {{ carrito.total }}€</h4>
        <button class="btn btn-dark btn-lg" (click)="confirmarPedido()">
          Confirmar pedido
        </button>
      </div>
    </div>
  </div>
}
