<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4">Iniciar sesión</h3>

        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" placeholder="tu@email.com">
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="password" placeholder="••••••">
        </div>

        <button class="btn btn-dark w-100" (click)="login()" [disabled]="cargando">
          {{ cargando ? 'Entrando...' : 'Iniciar sesión' }}
        </button>

        <p class="text-center mt-3">
          ¿No tienes cuenta? <a routerLink="/registro">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </div>
</div>
