<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="card-title text-center mb-4">Crear cuenta</h3>

        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
        <div class="alert alert-success" *ngIf="exito">{{ exito }}</div>

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" [(ngModel)]="nombre" placeholder="Tu nombre">
        </div>

        <div class="mb-3">
          <label class="form-label">Apellidos</label>
          <input type="text" class="form-control" [(ngModel)]="apellidos" placeholder="Tus apellidos">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="email" placeholder="tu@email.com">
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input type="password" class="form-control" [(ngModel)]="password" placeholder="Mínimo 6 caracteres">
        </div>

        <button class="btn btn-dark w-100" (click)="registro()" [disabled]="cargando">
          {{ cargando ? 'Creando cuenta...' : 'Registrarse' }}
        </button>

        <p class="text-center mt-3">
          ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
        </p>
      </div>
    </div>
  </div>
</div>
